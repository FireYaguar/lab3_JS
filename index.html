<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacefight</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060c;
        overflow: hidden;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        font: 14px ui-monospace, Menlo, Consolas, monospace;
        color: #cfe3ff;
      }
      #ui > * {
        pointer-events: auto;
      }
      .panel {
        background: #0a0d1a;
        border: 1px solid #5aa0ff;
        border-radius: 8px;
        padding: 20px 24px;
        min-width: 340px;
      }
      .panel h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      .panel ul {
        list-style: none;
        padding: 0;
        margin: 6px 0;
      }
      .panel li {
        padding: 4px 0;
      }
      .panel li span {
        color: #9ab;
      }
      .rooms-head {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        color: #9ab;
      }
      .error {
        color: #ff9a9a;
        min-height: 1em;
      }
      .warn {
        color: #ffd35a;
        margin: 4px 0;
      }
      .ui-actions {
        position: fixed;
        left: 50%;
        top: calc(50% + 130px);
        transform: translateX(-50%);
      }
      button,
      input {
        font: inherit;
        color: inherit;
        background: #14203a;
        border: 1px solid #5aa0ff;
        border-radius: 4px;
        padding: 6px 12px;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
